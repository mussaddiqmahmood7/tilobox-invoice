name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build PDF Styles
        run: npm run build:pdf-css

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
