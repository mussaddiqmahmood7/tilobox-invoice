name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Only Chromium: both Playwright projects use it, so pulling Firefox and
      # WebKit would add minutes per run for browsers nothing here targets.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds and serves the production bundle (see playwright.config.ts).
      - name: Smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
