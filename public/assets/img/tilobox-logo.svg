<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" fill="none">
  <!-- TiloBox Modern Box & Invoice Icon -->
  <g transform="translate(4, 4)">
    <defs>
      <linearGradient id="tiloBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B82F6"/>
        <stop offset="100%" stop-color="#1D4ED8"/>
      </linearGradient>
      <linearGradient id="tiloAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#60A5FA"/>
        <stop offset="100%" stop-color="#2563EB"/>
      </linearGradient>
    </defs>
    <!-- Rounded Container Box -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#tiloBlueGrad)"/>
    <!-- Folded Receipt Sheet Inside -->
    <path d="M18 16 C18 14.5 19.5 13.5 21 13.5 L43 13.5 C44.5 13.5 46 14.5 46 16 L46 47 L41 43 L36 47 L32 43 L28 47 L23 43 L18 47 Z" fill="#FFFFFF" opacity="0.96"/>
    <!-- Receipt Lines -->
    <rect x="23" y="21" width="18" height="3" rx="1.5" fill="#2563EB"/>
    <rect x="23" y="27" width="12" height="2.5" rx="1.25" fill="#93C5FD"/>
    <rect x="23" y="33" width="15" height="2.5" rx="1.25" fill="#93C5FD"/>
    <!-- Green Check Badge -->
    <circle cx="46" cy="46" r="10" fill="#10B981"/>
    <path d="M42 46 L45 49 L50 43" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <text x="82" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="currentColor" class="text-foreground">Tilo<tspan fill="#2563EB">Box</tspan></text>
  <text x="188" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="-0.3" fill="#64748B">Invoice</text>
  <rect x="83" y="52" width="198" height="2" rx="1" fill="#E2E8F0" opacity="0.6"/>
</svg>
